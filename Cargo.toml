[package]
name = "gridskipper"
version = "0.1.0"
edition = "2024"

[lib]
name = "gridskipper"
path = "src/lib.rs"

[[bin]]
name = "gridskipper"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "3.1.1"
image = "0.25.9"
tempfile = "3.24.0"

[lints.clippy]
doc_lazy_continuation = "allow"
