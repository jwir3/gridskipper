[package]
name = "gridskipper"
version = "0.1.0"
edition = "2024"

[lib]
name = "gridskipper"
path = "src/lib.rs"

[[bin]]
name = "gridskipper"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "3.0.0"
image = "0.25.9"

[dev-dependencies]
tempfile = "3.8"
